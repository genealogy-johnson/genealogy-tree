# ============================================================
# pyproject.toml (Python project configuration)
# ============================================================
# REQ.PYTHON: Python projects MUST include pyproject.toml as the single source of truth.
# WHY: Centralizes project configuration.
# CUSTOM: Update identity and build tool src folders.

# ============================================================
# SECTION 1: PROJECT IDENTITY (name, version, CUSTOM dependencies)
# ============================================================

[project]
name = "genealogy-tree" # CUSTOM: Package distribution name (use lowercase and dashes).
readme = "README.md"
requires-python = ">=3.14"
version = "0.1.0"


[dependency-groups]
docs = [
    # WHY: Only needed for building documentation, not required for running the package.
    "mkdocstrings-python", # automatic API documentation from docstrings
    "zensical", # fast and minimal static site generator for documentation
]

[project.urls]
Homepage = "https://github.com/genealogy-johnson/genealogy-tree"
Repository = "https://github.com/genealogy-johnson/genealogy-tree"
Documentation = "https://genealogy-johnson.github.io/genealogy-tree/"
Issues = "https://github.com/genealogy-johnson/genealogy-tree/issues"
Changelog = "https://github.com/genealogy-johnson/genealogy-tree/blob/main/CHANGELOG.md"


# === UV (PYTHON ENVIRONMENT AND DEPENDENCY MANAGEMENT) ===

[tool.uv]
# WHY: Install all dependency groups defined by this repository by default.
# OBS: This keeps the canonical `uv sync` command identical across project types
#      and ensures all repository features work after setup.
default-groups = "all"
